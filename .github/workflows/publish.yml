name: Publish language packages

on:
  workflow_dispatch:
    inputs:
      registry:
        description: Registry to publish
        required: true
        type: choice
        options:
          - npm
          - pypi
          - crates-io
      npm_tags_only:
        description: Update npm release labels for an already published version
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  check-packages:
    uses: ./.github/workflows/check-bindings.yml

  npm:
    if: inputs.registry == 'npm'
    needs: check-packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@12.2.0
      - uses: actions/download-artifact@v4
        with:
          name: npm-distribution
          path: ${{ runner.temp }}/npm-distribution
      - if: ${{ !inputs.npm_tags_only }}
        run: npm publish "$RUNNER_TEMP"/npm-distribution/*.tgz --tag latest --provenance
      - run: npm dist-tag add "$(node -p 'require("./package.json").name + "@" + require("./package.json").version')" latest

  pypi:
    if: inputs.registry == 'pypi'
    needs: check-packages
    runs-on: ubuntu-latest
    environment: pypi
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  crates-io:
    if: inputs.registry == 'crates-io'
    needs: check-packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: rust-distribution
          path: ${{ runner.temp }}/rust-distribution
      - name: Verify publication matches the tested crate
        run: |
          cargo publish --dry-run --locked
          version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml)"
          cmp "$RUNNER_TEMP/rust-distribution/tree-sitter-rake-$version.crate" "target/package/tree-sitter-rake-$version.crate"
      - id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
