name: Publish language packages

on:
  workflow_dispatch:
    inputs:
      registry:
        description: Registry to publish
        required: true
        type: choice
        options:
          - npm
          - pypi
          - crates-io

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    if: inputs.registry == 'npm'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - run: npm test
      - run: npm publish --tag beta --provenance
      - run: npm dist-tag add "$(node -p '`${require("./package.json").name}@${require("./package.json").version}`')" latest

  pypi:
    if: inputs.registry == 'pypi'
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install build auditwheel patchelf
      - run: python -m build --sdist
      - run: python -m build --wheel --outdir wheelhouse
      - run: auditwheel repair wheelhouse/*.whl --wheel-dir dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  crates-io:
    if: inputs.registry == 'crates-io'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: cargo package
      - id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
