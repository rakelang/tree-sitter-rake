name: Check generated bindings

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./bindings/go

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - run: swift test
