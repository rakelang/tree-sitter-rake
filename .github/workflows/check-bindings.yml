name: Check generated bindings

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: Checked source commit or release tag
        type: string
        default: ""

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: git diff --exit-code -- src
      - name: Test the npm archive in a fresh consumer
        shell: bash
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          version="$(node -p 'require("./package.json").version')"
          archive="$RUNNER_TEMP/tree-sitter-rake-$version.tgz"
          consumer="$(mktemp -d "$RUNNER_TEMP/rake-npm-consumer.XXXXXX")"
          cd "$consumer"
          npm init --yes
          npm install "$archive" tree-sitter@0.25.1
          node node_modules/tree-sitter-rake/bindings/node/binding_test.js
      - uses: actions/upload-artifact@v4
        with:
          name: npm-distribution
          path: ${{ runner.temp }}/tree-sitter-rake-*.tgz
          if-no-files-found: error

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install build auditwheel patchelf twine
      - name: Build the wheel from the source archive
        run: |
          python -m build --sdist
          python -m pip wheel --no-cache-dir --no-deps --wheel-dir wheelhouse dist/*.tar.gz
          auditwheel repair wheelhouse/*.whl --wheel-dir dist
          python -m twine check --strict dist/*
      - name: Test the wheel and source archive in fresh consumers
        run: bash tools/check_python_packages.sh dist
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Test the same artifacts on the minimum Python version
        run: bash tools/check_python_packages.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "2"
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - run: cargo test --locked
      - run: cargo package --locked
      - name: Test the packaged crate
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml)"
          cargo test --locked --manifest-path "target/package/tree-sitter-rake-$version/Cargo.toml"
      - uses: actions/upload-artifact@v4
        with:
          name: rust-distribution
          path: target/package/*.crate
          if-no-files-found: error

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./bindings/go

  swift:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - run: swift test
