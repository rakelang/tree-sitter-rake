[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-rake"
description = "Tree-sitter grammar for Rake, a vector-first SIMD language"
version = "0.7.0"
keywords = ["incremental", "parsing", "tree-sitter", "rake"]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
authors = [{ name = "Kieran Rosenberg" }]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"

[project.urls]
Homepage = "https://github.com/rakelang/tree-sitter-rake"

[project.optional-dependencies]
core = ["tree-sitter~=0.25"]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
